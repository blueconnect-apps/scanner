name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions vastgepind op commit, zodat een verplaatste tag geen andere code kan uitvoeren.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          # Repository-variabele (Settings > Secrets and variables > Actions > Variables).
          # Geen secret: de waarde komt toch leesbaar in de gebouwde JavaScript.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_TOKEN_STORAGE_KEY: ${{ vars.VITE_TOKEN_STORAGE_KEY }}
          VITE_API_TIMEOUT_MS: ${{ vars.VITE_API_TIMEOUT_MS }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
